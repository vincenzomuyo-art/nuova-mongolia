<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI  FIX</title>
<style>
  body { font-family: system-ui; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  h1 { color: #38bdf8; }
  #chat { width: 90%; max-width: 650px; height: 300px; background: #1e293b; border-radius: 12px; padding: 15px; overflow-y: auto; margin-bottom: 20px; }
.msg { margin: 10px 0; }.user { color: #22c55e; }.bot { color: #38bdf8; }
  button { background: #38bdf8; border: none; padding: 18px 35px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; margin: 5px; }
  button.recording { background: #ef4444; }

  .arcobaleno {
    background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet, red);
    background-size: 400% auto;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    animation: muoviArcobaleno 4s linear infinite;
  }
</style>
</head>
<body>

<h1>🤖 Assistente vocale MATT<span class="arcobaleno">IA</span></h1>
<div id="chat"></div>
<button id="btnMic">Tieni premuto per parlare</button>
<button id="btnTest">Test Voce</button>

<script>
const GEMINI_API_KEY = "AQ.Ab8RN6IK3_ys-Q2SDP8vxxLXvFUgxbrQKUClLqjZa3CPSm2RuQ";
const chat = document.getElementById('chat');
const btnMic = document.getElementById('btnMic');
const btnTest = document.getElementById('btnTest');

function log(testo, chi='bot') {
  const div = document.createElement('div');
  div.className = `msg ${chi}`;
  div.textContent = chi === 'user'? `Tu: ${testo}` : `Bot: ${testo}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = 'it-IT';

let voceItaliana = null;
function setVoce() {
  const voci = speechSynthesis.getVoices();
  voceItaliana = voci.find(v => v.lang === "it-IT");
}
setVoce();
speechSynthesis.onvoiceschanged = setVoce;

// FUNZIONE PARLA FIXATA
function parla(testo) {
  log(testo);
  speechSynthesis.cancel(); // ferma quello prima

  // Trucco: lo facciamo partire dopo 100ms
  setTimeout(() => {
    const utterance = new SpeechSynthesisUtterance(testo);
    utterance.lang = 'it-IT';
    utterance.rate = 1;
    utterance.pitch = 1;
    if (voceItaliana) utterance.voice = voceItaliana;
    speechSynthesis.speak(utterance);
  }, 100);
}

async function chiediAGemini(domanda) {
  log(domanda, 'user');
  log("Sto pensando...");
  btnMic.disabled = true;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: `Rispondi in italiano, breve e amichevole, max 2 frasi: ${domanda}` }] }] })
    });
    const data = await res.json();
    const risposta = data.candidates[0].content.parts[0].text;
    chat.lastChild.remove(); // toglie "sto pensando"
    parla(risposta);
  } catch (e) {
    log("Errore API");
    btnMic.disabled = false;
  }
  btnMic.disabled = false;
}

// Eventi
btnMic.onmousedown = () => { btnMic.classList.add('recording'); recognition.start(); }
btnMic.onmouseup = () => { btnMic.classList.remove('recording'); recognition.stop(); }
btnTest.onclick = () => parla("Ciao, mi senti? La voce funziona!");

recognition.onresult = (e) => chiediAGemini(e.results[0][0].transcript);
recognition.onerror = () => log("Errore microfono");
</script>

</body>
</html>
