<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌍 Indovina la bandiera sulla mappa</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f3f0;
            color: #1e1e1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .game-container {
            max-width: 900px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
        }
        h1 {
            font-size: 1.8rem;
            color: #1a2634;
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            text-align: center;
            color: #6a7a8a;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .header-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .header-stats .stats {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #6a7a8a;
        }
        .header-stats .stats span {
            background: #f8f6f3;
            padding: 4px 14px;
            border-radius: 20px;
        }
        .header-stats .stats .score {
            color: #f4c542;
        }

        #map {
            width: 100%;
            height: 400px;
            border-radius: 16px;
            border: 2px solid #ddd;
            margin-bottom: 16px;
            background: #e8ecf0;
        }

        /* ============================================================
           NASCONDE I TOOLTIP/POPUP (per sicurezza)
           ============================================================ */
        .leaflet-tooltip {
            display: none !important;
        }
        .leaflet-popup {
            display: none !important;
        }

        .flag-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 12px;
            margin: 12px 0;
        }
        .flag-options button {
            padding: 8px;
            border-radius: 12px;
            border: 3px solid #ddd;
            background: #fff;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flag-options button:hover:not(:disabled) {
            border-color: #f4c542;
            transform: scale(1.03);
        }
        .flag-options button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .flag-options button.correct {
            border-color: #28a745;
            background: #e8f5e9;
        }
        .flag-options button.wrong {
            border-color: #dc3545;
            background: #fde0e0;
        }
        .flag-options button img {
            width: 100%;
            max-width: 120px;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .feedback {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            margin: 8px 0;
        }
        .feedback.correct {
            background: #e8f5e9;
            color: #28a745;
            border: 2px solid #28a745;
        }
        .feedback.wrong {
            background: #fde0e0;
            color: #dc3545;
            border: 2px solid #dc3545;
        }

        .next-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: #f4c542;
            color: #1a2634;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .next-btn:hover {
            background: #ffd966;
            transform: scale(1.02);
        }

        .restart-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: #6c757d;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .restart-btn:hover {
            background: #5a6268;
        }

        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #6a7a8a;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: #1a2634;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 16px;
            }
            .flag-options {
                grid-template-columns: 1fr 1fr;
            }
            .header-stats {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            #map {
                height: 280px;
            }
        }
    </style>
</head>

            { nome: "Vietnam", codice: "vn", lat: 14.058, lng: 108.277 },
            { nome: "Yemen", codice: "ye", lat: 15.553, lng: 48.516 },
            { nome: "Zambia", codice: "zm", lat: -13.134, lng: 27.849 },
            { nome: "Zimbabwe", codice: "zw", lat: -19.015, lng: 29.155 },
            // Non riconosciuti ONU
            { nome: "Kosovo", codice: "xk", lat: 42.603, lng: 20.902 },
            { nome: "Palestina", codice: "ps", lat: 31.947, lng: 35.227 },
            { nome: "Sahara Occidentale", codice: "eh", lat: 24.216, lng: -12.886 },
            { nome: "Taiwan", codice: "tw", lat: 23.698, lng: 120.960 },
            { nome: "Abcasia", codice: "ab", lat: 43.022, lng: 41.015 },
            { nome: "Ossezia del Sud", codice: "ge", lat: 42.287, lng: 43.835 },
            { nome: "Transnistria", codice: "md", lat: 46.846, lng: 29.600 },
            { nome: "Cipro del Nord", codice: "cy", lat: 35.186, lng: 33.382 },
            { nome: "Artsakh", codice: "am", lat: 39.840, lng: 46.773 },
        ];

        const FLAG_BASE_URL = 'https://flagcdn.com/w320/';
        const NUM_OPZIONI = 4;

        // ===== STATO =====
        let stato = {
            punteggio: 0,
            tentativi: 0,
            corretti: 0,
            paesiUsati: [],
            gameCompleted: false,
        };

        let map = null;
        let currentCountry = null;
        let currentOptions = [];
        let answered = false;
        let geoJsonLayer = null;
        let highlightLayer = null;
        let mapInitialized = false;

        // ===== CARICA STATO =====
        function caricaStato() {
            try {
                const salvato = localStorage.getItem('mappaBandiere_stato');
                if (salvato) {
                    stato = JSON.parse(salvato);
                    if (!stato.paesiUsati) stato.paesiUsati = [];
                    if (stato.gameCompleted === undefined) stato.gameCompleted = false;
                }
            } catch (e) {}
        }

        function salvaStato() {
            try {
                localStorage.setItem('mappaBandiere_stato', JSON.stringify(stato));
            } catch (e) {}
        }

        // ===== INIZIALIZZA MAPPA (SENZA NOMI) =====
        function initMap() {
            if (mapInitialized) return;

            map = L.map('map', {
                center: [20, 0],
                zoom: 2,
                zoomControl: false,
                attributionControl: false,
            });

            // ============================================================
            //  USIAMO UN LAYER SENZA NOMI!
            //  light_nolabels = mappa chiara senza etichette
            // ============================================================
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
                attribution: '',
                subdomains: 'abcd',
                maxZoom: 19,
            }).addTo(map);

            mapInitialized = true;

            // Carica GeoJSON dei paesi
            fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')
                .then(res => res.json())
                .then(data => {
                    geoJsonLayer = L.geoJSON(data, {
                        style: function(feature) {
                            return {
                                fillColor: '#d3d3d3',
                                fillOpacity: 0.6,
                                color: '#888',
                                weight: 1,
                            };
                        },
                        onEachFeature: function(feature, layer) {
                            // NON aggiungiamo tooltip/popup
                        }
                    }).addTo(map);

                    generaDomanda();
                })
                .catch(err => {
                    console.error('Errore caricamento GeoJSON:', err);
                    document.getElementById('flagContainer').innerHTML =
                        '<div style="text-align:center;color:#dc3545;padding:20px;">❌ Errore caricamento mappa. Ricarica la pagina.</div>';
                });
        }

        // ===== GENERA DOMANDA =====
        function generaDomanda() {
            if (stato.gameCompleted) {
                mostraSchermataFinale();
                return;
            }

            const disponibili = PAESI.filter(p => !stato.paesiUsati.includes(p.codice));

            if (disponibili.length === 0) {
                stato.gameCompleted = true;
                salvaStato();
                mostraSchermataFinale();
                return;
            }

            const idx = Math.floor(Math.random() * disponibili.length);
            const paese = disponibili[idx];
            currentCountry = paese;

            stato.paesiUsati.push(paese.codice);
            salvaStato();

            const altri = PAESI.filter(p => p.codice !== paese.codice);
            let opzioni = [paese];
            let tentativi = 0;
            while (opzioni.length < NUM_OPZIONI && tentativi < 100) {
                tentativi++;
                const rand = Math.floor(Math.random() * altri.length);
                const p = altri[rand];
                if (!opzioni.some(o => o.codice === p.codice)) {
                    opzioni.push(p);
                }
            }
            opzioni = opzioni.sort(() => Math.random() - 0.5);
            currentOptions = opzioni;
            answered = false;

            evidenziaPaese(paese);
            mostraBandiere(opzioni);

            document.getElementById('feedbackArea').innerHTML = '';
            document.getElementById('nextButtonContainer').innerHTML = '';

            aggiornaStats();
        }

        // ===== EVIDENZIA PAESE SULLA MAPPA =====
        function evidenziaPaese(paese) {
            if (!geoJsonLayer) return;

            if (highlightLayer) {
                map.removeLayer(highlightLayer);
                highlightLayer = null;
            }

            let found = false;
            geoJsonLayer.eachLayer(function(layer) {
                const props = layer.feature?.properties;
                if (!props) return;

                const names = [props.name, props.NAME, props.name_long, props.ADMIN];
                const match = names.some(n => {
                    if (!n) return false;
                    return n.toLowerCase().includes(paese.nome.toLowerCase()) ||
                        paese.nome.toLowerCase().includes(n.toLowerCase()) ||
                        n.toLowerCase() === paese.nome.toLowerCase();
                });

                if (match) {
                    const cloned = layer.toGeoJSON();
                    highlightLayer = L.geoJSON(cloned, {
                        style: {
                            fillColor: '#dc3545',
                            fillOpacity: 0.7,
                            color: '#dc3545',
                            weight: 2,
                        }
                    }).addTo(map);

                    map.setView([paese.lat, paese.lng], 4);
                    found = true;
                }
            });

            if (!found) {
                highlightLayer = L.circle([paese.lat, paese.lng], {
                    radius: 200000,
                    color: '#dc3545',
                    fillColor: '#dc3545',
                    fillOpacity: 0.3,
                    weight: 3,
                }).addTo(map);
                map.setView([paese.lat, paese.lng], 4);
            }
        }

        // ===== MOSTRA BANDIERE =====
        function mostraBandiere(opzioni) {
            const container = document.getElementById('flagOptions');
            container.innerHTML = opzioni.map((p, idx) => `
                <button onclick="rispondi(${idx})" id="opt-${idx}">
                    <img src="${FLAG_BASE_URL}${p.codice}.png" alt="Bandiera" loading="lazy" />
                </button>
            `).join('');
        }

        // ===== RISPOSTA =====
        function rispondi(indice) {
            if (answered) return;
            answered = true;

            const scelta = currentOptions[indice];
            const corretta = scelta.codice === currentCountry.codice;

            stato.tentativi++;
            if (corretta) {
                stato.corretti++;
                stato.punteggio += 10;
            } else {
                stato.punteggio = Math.max(0, stato.punteggio - 2);
            }
            salvaStato();
            aggiornaStats();

            const feedback = document.getElementById('feedbackArea');
            if (corretta) {
                feedback.innerHTML = `
                    <div class="feedback correct">✅ Corretto!</div>
                `;
            } else {
                feedback.innerHTML = `
                    <div class="feedback wrong">❌ Sbagliato! La risposta corretta era ${currentCountry.nome}</div>
                `;
            }

            const buttons = document.querySelectorAll('#flagOptions button');
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                const p = currentOptions[i];
                if (p.codice === currentCountry.codice) {
                    btn.classList.add('correct');
                } else if (i === indice && !corretta) {
                    btn.classList.add('wrong');
                }
            });

            document.getElementById('nextButtonContainer').innerHTML = `
                <button class="next-btn" onclick="prossimaDomanda()">➡️ Prossima domanda</button>
            `;
        }

        // ===== PROSSIMA DOMANDA =====
        function prossimaDomanda() {
            generaDomanda();
        }

        // ===== AGGIORNA STATS =====
        function aggiornaStats() {
            document.getElementById('scoreDisplay').textContent = stato.punteggio;
            const percent = stato.tentativi > 0 ? Math.round((stato.corretti / stato.tentativi) * 100) : 0;
            document.getElementById('percentDisplay').textContent = percent + '%';
            document.getElementById('attemptDisplay').textContent = stato.tentativi;
        }

        // ===== SCHERMATA FINALE =====
        function mostraSchermataFinale() {
            const container = document.getElementById('flagContainer');
            const percent = stato.tentativi > 0 ? Math.round((stato.corretti / stato.tentativi) * 100) : 0;

            container.innerHTML = `
                <div style="text-align:center;padding:40px 20px;">
                    <div style="font-size:4rem;margin-bottom:16px;">🏆</div>
                    <h2 style="color:#1a2634;font-size:1.8rem;margin-bottom:8px;">Hai completato tutte le bandiere!</h2>
                    <div style="background:#f8f6f3;border-radius:16px;padding:20px;margin:20px 0;">
                        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
                            <div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                                <div style="font-size:0.8rem;color:#6a7a8a;">🏆 Punteggio</div>
                                <div style="font-size:2rem;font-weight:700;color:#f4c542;">${stato.punteggio}</div>
                            </div>
                            <div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                                <div style="font-size:0.8rem;color:#6a7a8a;">✅ Corrette</div>
                                <div style="font-size:2rem;font-weight:700;color:#28a745;">${stato.corretti} / ${stato.tentativi}</div>
                            </div>
                            <div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                                <div style="font-size:0.8rem;color:#6a7a8a;">🎯 Percentuale</div>
                                <div style="font-size:2rem;font-weight:700;color:#17a2b8;">${percent}%</div>
                            </div>
                        </div>
                    </div>
                    <button class="restart-btn" onclick="riavvia()" style="background:#f4c542;color:#1a2634;font-weight:700;font-size:1rem;padding:14px;">🔄 Ricomincia</button>
                </div>
            `;

            document.getElementById('nextButtonContainer').innerHTML = '';
            document.getElementById('feedbackArea').innerHTML = '';
            document.getElementById('flagOptions').innerHTML = '';
        }

        // ===== RIAVVIA =====
        function riavvia() {
            stato = {
                punteggio: 0,
                tentativi: 0,
                corretti: 0,
                paesiUsati: [],
                gameCompleted: false,
            };
            salvaStato();

            if (geoJsonLayer) {
                if (highlightLayer) {
                    map.removeLayer(highlightLayer);
                    highlightLayer = null;
                }
            }

            document.getElementById('flagContainer').innerHTML = `
                <div class="flag-options" id="flagOptions"></div>
            `;
            document.getElementById('feedbackArea').innerHTML = '';
            document.getElementById('nextButtonContainer').innerHTML = '';

            generaDomanda();
        }

        // ===== AVVIA =====
        function avvia() {
            caricaStato();
            initMap();
        }

        document.addEventListener('DOMContentLoaded', avvia);
    </script>
</body>
</html>
