    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f3f0;
            color: #1e1e1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            background: #fff;
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 1.5rem;
            color: #1a2634;
        }
        .header .stats {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #6a7a8a;
        }
        .header .stats span {
            background: #f8f6f3;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .flag-container {
            background: #1a2634;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        .flag-container img {
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: block;
            margin: 0 auto;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .options button {
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid #ddd;
            background: #fff;
            font-size: 1rem;
            font-weight: 600;
            color: #1a2634;
            cursor: pointer;
            transition: 0.2s;
        }
        .options button:hover {
            border-color: #f4c542;
            transform: scale(1.02);
        }
        .options button:active {
            transform: scale(0.96);
        }
        .options button.correct {
            border-color: #28a745;
            background: #e8f5e9;
        }
        .options button.wrong {
            border-color: #dc3545;
            background: #fde0e0;
        }
        .options button.disabled {
            cursor: default;
            opacity: 0.7;
        }
        .options button.disabled:hover {
            transform: none;
            border-color: #ddd;
        }
        .feedback {
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 16px;
        }
        .feedback.correct {
            background: #e8f5e9;
            color: #28a745;
            border: 2px solid #28a745;
        }
        .feedback.wrong {
            background: #fde0e0;
            color: #dc3545;
            border: 2px solid #dc3545;
        }
        .next-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: #f4c542;
            color: #1a2634;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .next-btn:hover {
            background: #ffd966;
            transform: scale(1.02);
        }
        .restart-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: #6c757d;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .restart-btn:hover {
            background: #5a6268;
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #6a7a8a;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: #1a2634;
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .game-container {
                padding: 20px 16px;
            }
            .options {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

const FLAG_BASE_URL = 'https://flagcdn.com/w320/';
const NUM_OPZIONI = 4;

// ===== STATO (salvato in localStorage separato) =====
let stato = {
    punteggio: 0,
    tentativi: 0,
    corretti: 0,
    sequenza: [],
    paesiUsati: [],
    gameCompleted: false, // ← AGGIUNTO
};

function caricaStato() {
    try {
        const salvato = localStorage.getItem('giocoBandiere_stato');
        if (salvato) {
            stato = JSON.parse(salvato);
            if (!stato.paesiUsati) stato.paesiUsati = [];
            if (stato.gameCompleted === undefined) stato.gameCompleted = false;
        }
    } catch (e) {}
}

function salvaStato() {
    try {
        localStorage.setItem('giocoBandiere_stato', JSON.stringify(stato));
    } catch (e) {}
}

// ===== GENERA DOMANDA =====
function generaDomanda() {
    // Se il gioco è già completato, mostra la schermata finale
    if (stato.gameCompleted) {
        mostraSchermataFinale();
        return;
    }

    // Filtra i paesi non ancora usati
    const paesiDisponibili = PAESI.filter(p => !stato.paesiUsati.includes(p.codice));

    // Se tutti i paesi sono stati usati → GAME COMPLETED!
    if (paesiDisponibili.length === 0) {
        stato.gameCompleted = true;
        salvaStato();
        mostraSchermataFinale();
        return;
    }

    // Scegli un paese casuale tra quelli disponibili
    const idx = Math.floor(Math.random() * paesiDisponibili.length);
    const paeseCorretto = paesiDisponibili[idx];

    // Aggiungi il paese alla lista degli usati
    stato.paesiUsati.push(paeseCorretto.codice);

    // Scegli 3 paesi sbagliati
    const altriPaesi = PAESI.filter(p => p.codice !== paeseCorretto.codice);
    let opzioni = [paeseCorretto];
    let tentativi = 0;
    while (opzioni.length < NUM_OPZIONI && tentativi < 1000) {
        tentativi++;
        const rand = Math.floor(Math.random() * altriPaesi.length);
        const p = altriPaesi[rand];
        if (!opzioni.some(o => o.codice === p.codice)) {
            opzioni.push(p);
        }
    }
    opzioni = opzioni.sort(() => Math.random() - 0.5);

    stato.sequenza.push({
        paeseCorretto: paeseCorretto,
        opzioni: opzioni,
        sceltaUtente: undefined,
        corretta: undefined,
    });
    salvaStato();
    render();
}

                    </div>
                    <div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);grid-column:span 2;">
                        <div style="font-size:0.8rem;color:#6a7a8a;">🎯 Percentuale</div>

                    ⚡ Sfida un'amic@ in velocità

            </div>

    `;

    // Aggiorna gli stats in alto

// ===== RENDER =====
function render() {
    const container = document.getElementById('gameContent');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const percentDisplay = document.getElementById('percentDisplay');

    // Se il gioco è completato, mostra la schermata finale
    if (stato.gameCompleted) {
        mostraSchermataFinale();
        return;
    }

    // Aggiorna stats
    const percent = stato.tentativi > 0 ? Math.round((stato.corretti / stato.tentativi) * 100) : 0;
    scoreDisplay.textContent = `🏆 ${stato.punteggio}`;
    percentDisplay.textContent = `🎯 ${percent}%`;

    // Se non ci sono domande, generane una
    if (stato.sequenza.length === 0) {
        generaDomanda();
        return;
    }

    const ultima = stato.sequenza[stato.sequenza.length - 1];
    const paeseCorretto = ultima.paeseCorretto;
    const opzioni = ultima.opzioni;
    const sceltaUtente = ultima.sceltaUtente;
    const corretta = ultima.corretta;

    let html = `
        <div class="flag-container">
            <img src="${FLAG_BASE_URL}${paeseCorretto.codice}.png" alt="Bandiera" loading="lazy" />
            <div style="color:#aab;font-size:0.8rem;margin-top:8px;text-align:center;">
                ${stato.paesiUsati.length} / ${PAESI.length} bandiere completate
            </div>
        </div>
    `;

    html += `<div class="options">`;
    opzioni.forEach((opzione, idx) => {
        let classe = '';
        let disabled = false;
        if (sceltaUtente !== undefined) {
            disabled = true;
            if (idx === sceltaUtente && corretta) classe = 'correct';
            else if (idx === sceltaUtente && !corretta) classe = 'wrong';
            else if (opzione.codice === paeseCorretto.codice) classe = 'correct';
        }
        html += `
            <button class="${classe} ${disabled ? 'disabled' : ''}" 
                    onclick="${disabled ? '' : `rispondi(${idx})`}"
                    ${disabled ? 'disabled' : ''}>
                ${opzione.nome}
            </button>
        `;
    });
    html += `</div>`;

    if (sceltaUtente !== undefined) {
        html += `
            <div class="feedback ${corretta ? 'correct' : 'wrong'}">
                ${corretta ? '✅ Corretto!' : '❌ Sbagliato! La risposta corretta era: ' + paeseCorretto.nome}
            </div>
            <button class="next-btn" onclick="prossimaDomanda()">➡️ Prossima domanda</button>
        `;
    }

    html += `
        <button class="restart-btn" onclick="riavvia()">🔄 Ricomincia</button>
    `;

    container.innerHTML = html;
}

// ===== RISPOSTA =====
function rispondi(indice) {
    const ultima = stato.sequenza[stato.sequenza.length - 1];
    if (!ultima || ultima.sceltaUtente !== undefined) return;

    const scelta = ultima.opzioni[indice];
    const corretta = scelta.codice === ultima.paeseCorretto.codice;

    ultima.sceltaUtente = indice;
    ultima.corretta = corretta;

    stato.tentativi++;
    if (corretta) {
        stato.corretti++;
        stato.punteggio += 10;
    } else {
        stato.punteggio = Math.max(0, stato.punteggio - 2);
    }

    salvaStato();
    render();
}

// ===== PROSSIMA DOMANDA =====
function prossimaDomanda() {
    generaDomanda();
}

// ===== RIAVVIA =====
function riavvia() {
    stato = {
        punteggio: 0,
        tentativi: 0,
        corretti: 0,
        sequenza: [],
        paesiUsati: [],
        gameCompleted: false,
    };
    salvaStato();
    generaDomanda();
}

// ===== AVVIA =====
caricaStato();

if (stato.gameCompleted) {
    mostraSchermataFinale();
} else if (stato.sequenza.length === 0 || stato.sequenza[stato.sequenza.length - 1].sceltaUtente !== undefined) {
    generaDomanda();
} else {
    render();
     }
    </script>
