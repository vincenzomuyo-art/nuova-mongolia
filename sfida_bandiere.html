        <!-- ===== SEZIONE 1: LOGIN ===== -->
        <div class="section active" id="section-login">
            <div class="form-group">
                <label>👤 Inserisci il tuo nome</label>
                <input type="text" id="nicknameInput" placeholder="Il tuo nome" maxlength="20" />
            </div>
            <button class="btn btn-primary btn-block" onclick="login()">🚀 Entra nella lobby</button>
            <div id="loginError" style="color:#dc3545;margin-top:8px;display:none;"></div>
        </div>

        <!-- ===== SEZIONE 2: LOBBY ===== -->
        <div class="section" id="section-lobby">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
                <span style="font-weight:700;color:#1a2634;">👥 Giocatori online</span>
                <span id="onlineCount" style="font-size:0.85rem;color:#6a7a8a;">0 connessi</span>
            </div>
            <div class="player-list" id="playerList">
                <div style="text-align:center;color:#6a7a8a;padding:20px;">Nessun giocatore online</div>
            </div>

            <!-- Inviti ricevuti -->
            <div id="inviteContainer"></div>

            <div class="lobby-actions">
                <div class="row">
                    <button class="btn btn-secondary" onclick="creaPartita()">🎮 Crea partita</button>
                    <button class="btn btn-outline" onclick="logout()">🚪 Esci</button>
                </div>
            </div>
            <a href="https://vincenzomuyo-art.github.io/nuova-mongolia/index.html" class="back-link">← Torna al sito principale</a>
        </div>

        <!-- ===== SEZIONE 3: CREAZIONE PARTITA ===== -->
        <div class="section" id="section-create">
            <h2 style="color:#1a2634;font-size:1.4rem;margin-bottom:12px;">🎮 Crea partita</h2>
            <div class="form-group">
                <label>🏷️ Livello di difficoltà</label>
                <select id="livelloSelect">
                    <option value="facile">Facile (30 paesi noti)</option>
                    <option value="medio" selected>Medio (50 paesi)</option>
                    <option value="difficile">Difficile (70 paesi)</option>
                    <option value="impossibile">Impossibile (tutti i paesi)</option>
                </select>
            </div>
            <div class="form-group">
                <label>⏱️ Tempo partita (secondi)</label>
                <select id="tempoSelect">
                    <option value="30">30 secondi</option>
                    <option value="60" selected>60 secondi</option>
                    <option value="90">90 secondi</option>
                    <option value="120">120 secondi</option>
                    <option value="180">180 secondi</option>
                </select>
            </div>
            <div class="form-group">
                <label>👥 Scegli gli avversari (clicca su "Invita" nella lobby)</label>
                <div id="invitedPlayers" style="display:flex;flex-wrap:wrap;gap:8px;min-height:40px;padding:8px;background:#f8f6f3;border-radius:10px;">
                    <span style="color:#6a7a8a;font-size:0.9rem;">Nessun invito ancora accettato</span>
                </div>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;">
                <button class="btn btn-success" onclick="avviaPartita()" id="btnAvviaPartita" disabled>🚀 Avvia partita</button>
                <button class="btn btn-outline" onclick="annullaCreazione()">↩️ Annulla</button>
            </div>
            <div id="createError" style="color:#dc3545;margin-top:8px;display:none;"></div>
        </div>

        <!-- ===== SEZIONE 4: GIOCO ===== -->
        <div class="section" id="section-game">
            <div class="game-header">
                <div class="timer" id="timerDisplay">⏱️ 60</div>
                <div class="scores" id="scoreDisplay"></div>
            </div>
            <div id="gameContent">
                <div class="flag-container">
                    <img id="flagImage" src="" alt="Bandiera" style="width:100%;max-width:280px;border-radius:8px;" />
                </div>
                <div class="options-grid" id="optionsGrid"></div>
                <div id="feedbackArea"></div>
                <div id="gameStatus" style="text-align:center;color:#6a7a8a;font-weight:600;margin-top:12px;"></div>
            </div>
        </div>

        <!-- ===== SEZIONE 5: CLASSIFICA FINALE ===== -->
        <div class="section" id="section-final">
            <h2 style="color:#1a2634;font-size:1.6rem;text-align:center;margin-bottom:8px;">🏆 Classifica finale</h2>
            <div class="ranking" id="rankingContainer"></div>
            <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
                <button class="btn btn-primary btn-block" onclick="tornaLobby()">🔄 Nuova partita</button>
                <a href="https://vincenzomuyo-art.github.io/nuova-mongolia/index.html" class="btn btn-secondary btn-block" style="text-decoration:none;text-align:center;">🏠 Torna al sito principale</a>
            </div>
        </div>
    </div>

        function showSection(id) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showError(id, msg) {
            const el = document.getElementById(id);
            if (el) {
                el.textContent = msg;
                el.style.display = 'block';
                setTimeout(() => { el.style.display = 'none'; }, 4000);

        // ======================================================================
        //  LOGIN / LOGOUT
        // ======================================================================
        function login() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            if (!nickname) {
                showError('loginError', 'Inserisci un nome valido.');
                return;
            }
            if (nickname.length > 20) {
                showError('loginError', 'Il nome non può superare i 20 caratteri.');
                return;
            }

            currentUser = nickname;
            currentUserId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);

            // Salva utente su Firebase
            const userRef = db.ref('sfidaBandiere/utenti/' + currentUserId);
            userRef.set({
                nickname: currentUser,
                online: true,
                inGame: false,
                lastSeen: firebase.database.ServerValue.TIMESTAMP
            });

            // Rimuovi quando si disconnette
            userRef.onDisconnect().update({
                online: false,
                lastSeen: firebase.database.ServerValue.TIMESTAMP
            });

            // Rimuovi completamente dopo 2 minuti di inattività (gestito da server)
            // Ma per noi va bene così

            // Ascolta inviti
            ascoltaInviti();

            // Ascolta utenti online
            ascoltaUtentiOnline();

            showSection('section-lobby');
            document.getElementById('nicknameInput').value = '';
        }

        function logout() {
            if (currentUserId) {
                db.ref('sfidaBandiere/utenti/' + currentUserId).remove();
            }
            currentUser = null;
            currentUserId = null;
            showSection('section-login');
        }

        // ======================================================================
        //  ASCOLTA UTENTI ONLINE
        // ======================================================================
        let onlineUsers = {};
        let usersRef = db.ref('sfidaBandiere/utenti');

        function ascoltaUtentiOnline() {
            usersRef.on('value', snapshot => {
                const data = snapshot.val() || {};
                onlineUsers = {};
                const list = [];
                let count = 0;

                Object.keys(data).forEach(id => {
                    const user = data[id];
                    if (user.online && user.nickname !== currentUser) {
                        onlineUsers[id] = user;
                        list.push({
                            id: id,
                            nickname: user.nickname,
                            inGame: user.inGame || false
                        });
                        count++;
                    }
                });

                document.getElementById('onlineCount').textContent = count + ' connessi';
                renderPlayerList(list);
                aggiornaPulsantiInvito();
            });
        }

        function renderPlayerList(list) {
            const container = document.getElementById('playerList');
            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#6a7a8a;padding:20px;">Nessun altro giocatore online</div>';
                return;
            }

            container.innerHTML = list.map(p => `
                <div class="player-item" id="player-${p.id}">
                    <div>
                        <span class="name">${p.nickname}</span>
                        <span class="status ${p.inGame ? 'in-game' : 'online'}">${p.inGame ? '🔴 In partita' : '🟢 Online'}</span>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-primary" onclick="invitaGiocatore('${p.id}')" 
                                id="inviteBtn-${p.id}" ${p.inGame || currentGameId ? 'disabled' : ''}>
                            📨 Invita
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function aggiornaPulsantiInvito() {
            // Se sono in partita o in creazione, disabilita
            const inGame = currentGameId !== null;
            document.querySelectorAll('[id^="inviteBtn-"]').forEach(btn => {
                const id = btn.id.replace('inviteBtn-', '');
                const user = onlineUsers[id];
                if (!user) return;
                btn.disabled = inGame || user.inGame || invitedPlayers.some(p => p.userId === id && p.accepted);
            });
        }

        // ======================================================================
        //  INVITI
        // ======================================================================
        let currentInvites = [];

        function invitaGiocatore(userId) {
            const user = onlineUsers[userId];
            if (!user) return;
            if (user.inGame) {
                alert('Questo giocatore è già in partita.');
                return;
            }
            if (currentGameId) {
                alert('Sei già in una partita.');
                return;
            }

            // Se è già stato invitato e accettato
            if (invitedPlayers.some(p => p.userId === userId && p.accepted)) {
                alert('Questo giocatore ha già accettato il tuo invito.');
                return;
            }

            // Crea invito
            const inviteId = 'invite_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            const inviteRef = db.ref('sfidaBandiere/inviti/' + inviteId);
            inviteRef.set({
                mittenteId: currentUserId,
                mittenteNome: currentUser,
                destinatarioId: userId,
                destinatarioNome: user.nickname,
                stato: 'in attesa', // 'in attesa', 'accettato', 'rifiutato'
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            alert(`✅ Invito inviato a ${user.nickname}! Attendere risposta.`);
        }

        function ascoltaInviti() {
            db.ref('sfidaBandiere/inviti').orderByChild('destinatarioId').equalTo(currentUserId).on('value', snapshot => {
                const data = snapshot.val() || {};
                const invites = [];
                Object.keys(data).forEach(id => {
                    const inv = data[id];
                    if (inv.stato === 'in attesa') {
                        invites.push({ id, ...inv });
                    }
                });
                currentInvites = invites;
                renderInviti(invites);
            });
        }

        function renderInviti(invites) {
            const container = document.getElementById('inviteContainer');
            if (invites.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = invites.map(inv => `
                <div class="invite-notification">
                    <div style="font-weight:600;color:#1a2634;font-size:1rem;">
                        📨 ${inv.mittenteNome} ti sta sfidando!
                    </div>
                    <div class="invite-actions">
                        <button class="btn btn-sm btn-success" onclick="accettaInvito('${inv.id}')">✅ Accetta</button>
                        <button class="btn btn-sm btn-danger" onclick="rifiutaInvito('${inv.id}')">❌ Rifiuta</button>
                    </div>
                </div>
            `).join('');
        }

        function accettaInvito(inviteId) {
    const inviteRef = db.ref('sfidaBandiere/inviti/' + inviteId);
    inviteRef.child('stato').set('accettato');

    // Leggi i dettagli dell'invito
    inviteRef.once('value', snapshot => {
        const data = snapshot.val();
        if (!data) return;

        // Aggiorna lo stato dell'utente a inGame (in attesa)
        db.ref('sfidaBandiere/utenti/' + currentUserId).update({ inGame: true });

        alert(`✅ Hai accettato l'invito di ${data.mittenteNome}! Attendere che inizi la partita.`);
        
        // Rimuovi l'invito dalla lista
        // Non cancelliamo, ma lo teniamo per tener traccia
        // Lo stato 'accettato' sarà usato dall'invitante
    });
}

        function rifiutaInvito(inviteId) {
            db.ref('sfidaBandiere/inviti/' + inviteId).update({ stato: 'rifiutato' });
            alert('❌ Invito rifiutato.');
        }

        // ======================================================================
        //  CREAZIONE PARTITA
        // ======================================================================
        let invitatiAccettati = [];

        function creaPartita() {
            if (currentGameId) {
                alert('Sei già in una partita.');
                return;
            }

            // Reset
            invitedPlayers = [];
            invitatiAccettati = [];
            document.getElementById('invitedPlayers').innerHTML =
                '<span style="color:#6a7a8a;font-size:0.9rem;">Nessun invito ancora accettato</span>';
            document.getElementById('btnAvviaPartita').disabled = true;

            showSection('section-create');
            isGameCreator = true;

            // Ascolta gli inviti accettati
            ascoltaInvitiAccettati();
        }

        function ascoltaInvitiAccettati() {
            db.ref('sfidaBandiere/inviti').orderByChild('mittenteId').equalTo(currentUserId).on('value', snapshot => {
                const data = snapshot.val() || {};
                const accettati = [];
                Object.keys(data).forEach(id => {
                    const inv = data[id];
                    if (inv.stato === 'accettato') {
                        accettati.push({ id, ...inv });
                    }
                });

                invitatiAccettati = accettati.map(inv => ({
                    userId: inv.destinatarioId,
                    nickname: inv.destinatarioNome,
                    accepted: true
                }));

                // Aggiorna la lista
                const container = document.getElementById('invitedPlayers');
                if (invitatiAccettati.length === 0) {
                    container.innerHTML =
                    '<span style="color:#6a7a8a;font-size:0.9rem;">Nessun invito ancora accettato</span>';
                    document.getElementById('btnAvviaPartita').disabled = true;
                } else {
                    container.innerHTML = invitatiAccettati.map(p =>
                        `<span style="background:#e8f5e9;padding:4px 14px;border-radius:20px;font-weight:600;font-size:0.9rem;border:2px solid #28a745;">✅ ${p.nickname}</span>`
                    ).join('');
                    document.getElementById('btnAvviaPartita').disabled = false;
                }
            });
        }

        function annullaCreazione() {
            // Rimuovi tutti gli inviti in attesa
            db.ref('sfidaBandiere/inviti').orderByChild('mittenteId').equalTo(currentUserId).once('value', snap => {
                const data = snap.val() || {};
                Object.keys(data).forEach(id => {
                    if (data[id].stato === 'in attesa') {
                        db.ref('sfidaBandiere/inviti/' + id).remove();
                    }
                });
            });

            // Rimuovi listener
            db.ref('sfidaBandiere/inviti').orderByChild('mittenteId').equalTo(currentUserId).off();

            showSection('section-lobby');
            isGameCreator = false;
            invitatiAccettati = [];
            invitedPlayers = [];
            document.getElementById('btnAvviaPartita').disabled = true;
        }

        function avviaPartita() {
            const livello = document.getElementById('livelloSelect').value;
            const tempo = parseInt(document.getElementById('tempoSelect').value);

            if (invitatiAccettati.length === 0) {
                alert('Aspetta che almeno un giocatore accetti l\'invito.');
                return;
            }

            // Crea la partita su Firebase
            const gameId = 'game_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            const giocatori = {
                [currentUserId]: {
                    nickname: currentUser,
                    punteggio: 0,
                    corrette: 0,
                    totali: 0,
                    pronto: true
                }
            };

            invitatiAccettati.forEach(p => {
                giocatori[p.userId] = {
                    nickname: p.nickname,
                    punteggio: 0,
                    corrette: 0,
                    totali: 0,
                    pronto: false
                };
            });

            // Prepara le domande
            const bandiere = getBandierePerLivello(livello);
            const domande = bandiere.map(p => ({
                paese: p,
                opzioni: generaOpzioni(p, bandiere)
            }));

            const partitaRef = db.ref('sfidaBandiere/partite/' + gameId);
            partitaRef.set({
                creatoreId: currentUserId,
                livello: livello,
                tempoMax: tempo,
                stato: 'in corso',
                inizio: firebase.database.ServerValue.TIMESTAMP,
                giocatori: giocatori,
                domande: domande,
                domandaCorrente: 0,
                timerScaduto: false,
                fine: null
            }).then(() => {
                currentGameId = gameId;
                // Aggiorna stato utente
                db.ref('sfidaBandiere/utenti/' + currentUserId).update({ inGame: true });
                // Entra nella partita
                entraInPartita(gameId);
            });
        }

        function creaPartitaComeSeguace(creatoreId) {
            // Cerca la partita dell'invitante
            db.ref('sfidaBandiere/partite').orderByChild('creatoreId').equalTo(creatoreId).once('value', snap => {
                const data = snap.val() || {};
                let gameId = null;
                let gameData = null;

                Object.keys(data).forEach(id => {
                    const p = data[id];
                    if (p.stato === 'in attesa' || p.stato === 'in corso') {
                        if (Object.keys(p.giocatori || {}).length < MAX_PLAYERS) {
                            gameId = id;
                            gameData = p;
                        }
                    }
                });

                if (gameId && gameData) {
                    entriInPartita(gameId, gameData);
                } else {
                    alert('❌ La partita non esiste più.');
                    showSection('section-lobby');
                }
            });
        }

        function entriInPartita(gameId, gameData) {
            // Aggiungi il giocatore alla partita
            const update = {};
            update['giocatori/' + currentUserId] = {
                nickname: currentUser,
                punteggio: 0,
                corrette: 0,
                totali: 0,
                pronto: true
            };
            db.ref('sfidaBandiere/partite/' + gameId).update(update).then(() => {
                db.ref('sfidaBandiere/utenti/' + currentUserId).update({ inGame: true });
                currentGameId = gameId;
                entraInPartita(gameId);
            });
        }

        // ======================================================================
        //  ENTRARE IN PARTITA (gioco)
        // ======================================================================
        function entraInPartita(gameId) {
            // Rimuovi listener inviti
            db.ref('sfidaBandiere/inviti').orderByChild('destinatarioId').equalTo(currentUserId).off();

            showSection('section-game');
            currentGameId = gameId;

            // Ascolta la partita
            const gameRef = db.ref('sfidaBandiere/partite/' + gameId);
            gameRef.on('value', snapshot => {
                const data = snapshot.val();
                if (!data) {
                    alert('La partita è stata cancellata.');
                    tornaAllaLobby();
                    return;
                }

                gameState = data;
                aggiornaGioco(data);
            });

            // Ascolta lo stato timer
            // Il timer è gestito dal client, ma sincronizzato via Firebase
        }

        function aggiornaGioco(data) {
            if (!data) return;

            // Se la partita è finita
            if (data.stato === 'terminata' || data.timerScaduto) {
                mostraClassifica(data);
                return;
            }

            // Aggiorna punteggi
            const scores = data.giocatori || {};
            const scoreHtml = Object.keys(scores).map(id => {
                const s = scores[id];
                return `<span class="score-item">${s.nickname}: <span class="pts">${s.punteggio || 0}</span> pts</span>`;
            }).join('');
            document.getElementById('scoreDisplay').innerHTML = scoreHtml;

            // Aggiorna timer
            if (data.tempoMax && data.inizio) {
                const inizio = data.inizio;
                const now = Date.now();
                const elapsed = (now - inizio) / 1000;
                const remaining = Math.max(0, data.tempoMax - Math.floor(elapsed));
                const timerEl = document.getElementById('timerDisplay');
                timerEl.textContent = `⏱️ ${remaining}`;
                timerEl.className = 'timer' + (remaining <= 10 ? ' warning' : '');

                if (remaining <= 0 && !data.timerScaduto) {
                    db.ref('sfidaBandiere/partite/' + currentGameId).update({
                        timerScaduto: true,
                        stato: 'terminata',
                        fine: firebase.database.ServerValue.TIMESTAMP
                    });
                    return;
                }
            }

            // Mostra la domanda corrente
            const domande = data.domande || [];
            const idx = data.domandaCorrente || 0;
            if (idx >= domande.length) {
                // Fine delle domande
                db.ref('sfidaBandiere/partite/' + currentGameId).update({
                    stato: 'terminata',
                    fine: firebase.database.ServerValue.TIMESTAMP
                });
                return;
            }

            const domanda = domande[idx];
            if (!domanda) return;

            // Verifica se l'utente ha già risposto
            const giocatori = data.giocatori || {};
            const mioStato = giocatori[currentUserId];
            if (mioStato && mioStato.totali !== undefined && mioStato.totali > idx) {
                // Già risposto a questa domanda
                mostraDomanda(domanda, true);
            } else {
                mostraDomanda(domanda, false);
            }
        }

        function mostraDomanda(domanda, alreadyAnswered) {
            const flagEl = document.getElementById('flagImage');
            flagEl.src = FLAG_BASE_URL + domanda.paese.codice + '.png';

            const grid = document.getElementById('optionsGrid');
            const feedback = document.getElementById('feedbackArea');
            const status = document.getElementById('gameStatus');

            if (alreadyAnswered) {
                grid.innerHTML = domanda.opzioni.map((o, i) => {
                    const isCorrect = o.codice === domanda.paese.codice;
                    const isSelected = domanda.rispostaUtente === i;
                    let classe = '';
                    if (isCorrect) classe = 'correct';
                    else if (isSelected && !isCorrect) classe = 'wrong';
                    return `<button class="${classe}" disabled>${o.nome}</button>`;
                }).join('');

                const isCorrect = domanda.rispostaUtente !== undefined &&
                    domanda.opzioni[domanda.rispostaUtente]?.codice === domanda.paese.codice;
                feedback.innerHTML = `
                    <div class="feedback-bar ${isCorrect ? 'correct' : 'wrong'}">
                        ${isCorrect ? '✅ Corretto!' : '❌ Sbagliato! La risposta corretta era: ' + domanda.paese.nome}
                    </div>
                `;
                status.textContent = '⏳ In attesa della prossima domanda...';
                return;
            }

            grid.innerHTML = domanda.opzioni.map((o, i) =>
                `<button onclick="rispondiBandiera(${i})" id="opt-${i}">${o.nome}</button>`
            ).join('');
            feedback.innerHTML = '';
            status.textContent = `🧠 ${domanda.opzioni.length} opzioni - scegli la bandiera giusta`;
        }

        function rispondiBandiera(indice) {
            if (!gameState) return;
            if (document.querySelector('#optionsGrid button:disabled')) return; // già risposto

            const domande = gameState.domande || [];
            const idx = gameState.domandaCorrente || 0;
            if (idx >= domande.length) return;

            const domanda = domande[idx];
            const isCorrect = domanda.opzioni[indice].codice === domanda.paese.codice;

            // Aggiorna il punteggio del giocatore
            const update = {};
            const giocatori = gameState.giocatori || {};
            const mio = giocatori[currentUserId] || { nickname: currentUser, punteggio: 0, corrette: 0, totali: 0 };
            const punteggio = mio.punteggio || 0;
            const corrette = mio.corrette || 0;
            const totali = (mio.totali || 0) + 1;

            update['giocatori/' + currentUserId + '/punteggio'] = isCorrect ? punteggio + 10 : punteggio;
            update['giocatori/' + currentUserId + '/corrette'] = isCorrect ? corrette + 1 : corrette;
            update['giocatori/' + currentUserId + '/totali'] = totali;

            // Salva la risposta nella domanda
            const domandaPath = 'domande/' + idx + '/rispostaUtente';
            update[domandaPath] = indice;

            // Passa alla prossima domanda se tutti hanno risposto
            // Ma per semplicità, facciamo avanzare dopo 2 secondi
            db.ref('sfidaBandiere/partite/' + currentGameId).update(update).then(() => {
                // Mostra il risultato
                const grid = document.getElementById('optionsGrid');
                const feedback = document.getElementById('feedbackArea');
                const status = document.getElementById('gameStatus');

                grid.querySelectorAll('button').forEach((btn, i) => {
                    btn.disabled = true;
                    const isCorr = domanda.opzioni[i].codice === domanda.paese.codice;
                    if (isCorr) btn.classList.add('correct');
                    else if (i === indice && !isCorr) btn.classList.add('wrong');
                });

                feedback.innerHTML = `
                    <div class="feedback-bar ${isCorrect ? 'correct' : 'wrong'}">
                        ${isCorrect ? '✅ Corretto!' : '❌ Sbagliato! La risposta corretta era: ' + domanda.paese.nome}
                    </div>
                `;
                status.textContent = '⏳ Prossima domanda tra 2 secondi...';

                setTimeout(() => {
                    // Passa alla prossima domanda
                    const prossimaIdx = idx + 1;
                    db.ref('sfidaBandiere/partite/' + currentGameId).update({
                        domandaCorrente: prossimaIdx
                    });
                }, 2000);
            });
        }

        // ======================================================================
        //  CLASSIFICA FINALE
        // ======================================================================
        function mostraClassifica(data) {
            showSection('section-final');
            const giocatori = data.giocatori || {};
            const ranking = Object.keys(giocatori).map(id => ({
                id: id,
                nickname: giocatori[id].nickname || 'Sconosciuto',
                punteggio: giocatori[id].punteggio || 0,
                corrette: giocatori[id].corrette || 0,
                totali: giocatori[id].totali || 0
            })).sort((a, b) => b.punteggio - a.punteggio);

            const container = document.getElementById('rankingContainer');
            if (ranking.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#6a7a8a;">Nessun dato disponibile.</p>';
                return;
            }

            container.innerHTML = ranking.map((r, idx) => {
                let pos = `${idx + 1}.`;
                let cls = '';
                if (idx === 0) cls = 'gold';
                else if (idx === 1) cls = 'silver';
                else if (idx === 2) cls = 'bronze';
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '';
                return `
                    <div class="rank-item">
                        <span class="pos ${cls}">${medal} ${pos}</span>
                        <span style="flex:1;font-weight:600;color:#1a2634;">${r.nickname}</span>
                        <span style="font-weight:700;color:#f4c542;">${r.punteggio} pts</span>
                        <span style="font-size:0.8rem;color:#6a7a8a;">✅ ${r.corrette}/${r.totali}</span>
                    </div>
                `;
            }).join('');

            // Rimuovi listener e dati
            db.ref('sfidaBandiere/partite/' + currentGameId).off();
            currentGameId = null;
        }

        // ======================================================================
        //  FUNZIONI DI SUPPORTO
        // ======================================================================
        function generaOpzioni(paeseCorretto, pool) {
            const opzioni = [paeseCorretto];
            const altri = pool.filter(p => p.codice !== paeseCorretto.codice);
            let tentativi = 0;
            while (opzioni.length < 4 && tentativi < 100) {
                tentativi++;
                const rand = Math.floor(Math.random() * altri.length);
                const p = altri[rand];
                if (!opzioni.some(o => o.codice === p.codice)) {
                    opzioni.push(p);
                }
            }
            return opzioni.sort(() => Math.random() - 0.5);
        }

        function tornaAllaLobby() {
            if (currentGameId) {
                db.ref('sfidaBandiere/partite/' + currentGameId).off();
                db.ref('sfidaBandiere/utenti/' + currentUserId).update({ inGame: false });
                currentGameId = null;
            }
            showSection('section-lobby');
            ascoltaInviti();
        }

        function tornaLobby() {
            tornaAllaLobby();
            showSection('section-lobby');
        }

        // ======================================================================
        //  REINDIRIZZAMENTO DA ALTRI PAGINE
        // ======================================================================
        // Se la pagina viene caricata con parametro "invite=...", gestisci automaticamente
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const invite = params.get('invite');
            if (invite) {
                // Mostra un messaggio
                setTimeout(() => {
                    alert('📨 Invito ricevuto! Accedi per vedere la sfida.');
                }, 500);
            }
            // Se non loggato, mostra login
            if (!currentUser) {
                showSection('section-login');
            }
        };

        // ======================================================================
        //  PULSANTE "TORNA AL SITO PRINCIPALE"
        // ======================================================================
        // Già presente nei link
    </script>

</body>
