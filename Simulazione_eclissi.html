<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore Eclissi Solare</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #161f30;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* Spazio di visualizzazione del Sole */
        .sky {
            width: 260px;
            height: 260px;
            background: #0b0f19;
            border-radius: 50%;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            border: 2px solid #24344f;
        }

        .sun {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #fffdf0 0%, #ffbb00 60%, #ff8800 100%);
            border-radius: 50%;
            position: absolute;
            top: 60px;
            left: 60px;
            box-shadow: 0 0 40px #ffaa00;
        }

        /* La Luna si muove grazie alla variabile CSS --pos */
        .moon {
            width: 142px;
            height: 142px;
            background-color: #0b0f19;
            border-radius: 50%;
            position: absolute;
            top: 59px;
            /* Calcolo matematico nativo della posizione */
            left: calc(-90px + (149px * (var(--pos) / 100)));
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.8);
        }

        .controls {
            margin-top: 25px;
        }

        input[type=range] {
            width: 100%;
            margin: 15px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- La timeline del contenitore ascolta direttamente lo slider tramite JS in linea istantaneo -->
    <div class="container" id="app" style="--pos: 0;">
        <h1 style="font-size: 1.5rem; margin: 0 0 10px 0;">Simulatore di Eclissi</h1>
        
        <div class="sky">
            <div class="sun"></div>
            <div class="moon"></div>
        </div>

        <div class="controls">
            <!-- L'evento oninput aggiorna lo stile in tempo reale senza script esterni -->
            <input type="range" min="0" max="100" value="0" 
                   oninput="document.getElementById('app').style.setProperty('--pos', this.value); document.getElementById('val').innerText = this.value">
            <div style="font-size: 1.8rem; font-weight: bold; color: #ffcc00;"><span id="val">0</span>%</div>
        </div>
    </div>

</body>
</html>
